# /etc/nginx/sites-available/inu-recruitment   (replace recruitment.example-inu.edu.et with your real domain)

server {
  listen 80;
  listen [::]:80;
  server_name recruitment.example-inu.edu.et;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name recruitment.example-inu.edu.et;

  # certificates are created by certbot (see DEPLOYMENT.md, step 8)
  ssl_certificate     /etc/letsencrypt/live/recruitment.example-inu.edu.et/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/recruitment.example-inu.edu.et/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 30m;     # up to 10 files of MAX_FILE_SIZE_MB in one application

  # React build (static files)
  root /var/www/inu-recruitment;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API -> Express (PM2)
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # React Router: every other path returns index.html
  location / {
    try_files $uri /index.html;
  }
}
